[project]
name = "tokbuff-sso"
version = "0.1.0"
description = "Cross-site SSO ticket exchange for tokbuff family sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
litestar = ["litestar>=2.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokbuff_sso"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
