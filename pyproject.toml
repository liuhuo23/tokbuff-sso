[project]
name = "tokbuff-sso"
version = "0.4.0"
description = "Cross-site SSO ticket exchange + shared auth database for tokbuff family sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
litestar = ["litestar>=2.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "aiosqlite>=0.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokbuff_sso"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "pytest-httpx>=0.36.2",
]
